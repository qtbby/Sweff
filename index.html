<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Batch Framer — Canva Style</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<!-- Canva-like Top Bar -->
<div class="top-bar">
  <div class="logo-area" id="secretLogoTrigger">
    <span>🎨 Batch Framer</span>
  </div>
  <div class="action-buttons">
    <button class="btn btn-primary" id="initBtnTop">📂 Load Editors</button>
    <button class="btn btn-secondary" id="previewBatchBtnTop" style="display:none">✨ Generate Preview</button>
    <button class="btn btn-success" id="zipBtnTop" style="display:none">💾 Download ZIP</button>
  </div>
</div>

<div class="container">
  <!-- Upload Section -->
  <div class="card">
    <div class="card-header">🖼️ 1. Upload Assets</div>
    <div class="row">
      <div class="col"><label>Portrait Frame (PNG)</label><input type="file" id="framePInput" accept="image/png"></div>
      <div class="col"><label>Landscape Frame (PNG)</label><input type="file" id="frameLInput" accept="image/png"></div>
    </div>
    <label>📷 Photos (up to 50)</label>
    <input type="file" id="photosInput" multiple accept="image/*" style="margin-bottom:12px">
    <label>📦 ZIP Name</label>
    <input type="text" id="zipNameInput" placeholder="Framed_Photos">
    
    <div class="exposure-panel" style="margin-top:16px">
      <div class="exposure-header">
        <span>☀️ Auto Exposure Fix</span>
        <label style="display:flex; align-items:center; gap:6px"><input type="checkbox" id="autoExpToggle"> Enable</label>
      </div>
      <div id="exposure-controls" style="display:none; margin-top:12px">
        <div style="display:flex; gap:8px; margin-bottom:12px">
          <button class="btn btn-outline exp-mode-btn active-mode" data-mode="auto" style="flex:1">Auto Detect</button>
          <button class="btn btn-outline exp-mode-btn" data-mode="always" style="flex:1">Always Apply</button>
        </div>
        <label>Strength: <span id="strengthLabel">Medium</span></label>
        <input type="range" id="expStrength" min="1" max="5" value="3" style="width:100%; margin-top:4px">
      </div>
    </div>
  </div>

  <!-- Master Editors container -->
  <div id="editors-container"></div>

  <!-- Status and progress -->
  <div id="status"></div>
  <div id="progressBar"><div id="progressFill"></div></div>

  <!-- Preview Grid Section -->
  <div id="grid-preview-section" style="display:none">
    <div class="card">
      <div class="card-header">🖌️ 2. Review & Adjust</div>
      <div class="grid-container" id="grid-container"></div>
      <button class="btn btn-purple" id="previewAllBtn" style="margin-top:16px">🖼 Preview All Framed</button>
      
      <div style="background:#ecfdf5; border-radius:20px; padding:16px; margin-top:16px">
        <div style="display:flex; justify-content:space-between; align-items:center">
          <span style="font-weight:600; color:#065f46">✨ Enhance Download Quality</span>
          <label><input type="checkbox" id="enhanceToggle"> Enable</label>
        </div>
        <div id="enhance-controls" style="display:none; margin-top:12px">
          <div style="display:flex; gap:8px; margin-bottom:12px">
            <button class="btn btn-outline eq-res-btn active-res" data-res="1080">1080p</button>
            <button class="btn btn-outline eq-res-btn" data-res="1440">1440p</button>
            <button class="btn btn-outline eq-res-btn" data-res="2048">2K</button>
          </div>
          <label>JPEG Quality: <span id="eqQualityLabel">95%</span></label>
          <input type="range" id="eqQuality" min="80" max="100" value="95" style="width:100%">
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modals (Adjust & Gallery) -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal-content">
    <h3 style="margin-bottom:12px">✏️ Adjust Image</h3>
    <div id="modal-pan-wrap" class="pan-wrap" style="border-radius:16px; overflow:hidden">
      <canvas id="modal-photo-canvas"></canvas>
      <canvas id="modal-frame-canvas" class="frame-canvas"></canvas>
    </div>
    <div class="modal-btns" style="display:flex; gap:12px; margin-top:16px">
      <button class="btn btn-red" id="modalCancelBtn" style="flex:1">Cancel</button>
      <button class="btn btn-success" id="modalSaveBtn" style="flex:1">Save</button>
    </div>
  </div>
</div>

<div id="gallery-overlay" class="gallery-overlay">
  <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 20px; background:#111; color:white">
    <h3>📷 Gallery</h3>
    <span id="gallery-counter" style="color:#aaa"></span>
    <button id="galleryCloseBtn" class="btn btn-red" style="padding:6px 12px">Close</button>
  </div>
  <div style="display:flex; flex:1; overflow:hidden">
    <div id="gallery-strip" style="width:80px; background:#1a1a1a; overflow-y:auto; padding:8px 4px"></div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0f0f0f; position:relative">
      <div id="gallery-viewer-label" style="color:#aaa; margin-bottom:8px"></div>
      <div style="position:relative; display:flex; align-items:center; justify-content:center; width:100%; flex:1">
        <button class="g-arrow" id="gArrowL" style="left:10px">‹</button>
        <img id="gallery-main-img" style="max-width:90%; max-height:90%; object-fit:contain">
        <button class="g-arrow" id="gArrowR" style="right:10px">›</button>
      </div>
      <div style="display:flex; gap:12px; margin:16px">
        <button class="btn btn-outline" id="galleryPrevBtn" style="background:#333; color:white">Prev</button>
        <button class="btn btn-secondary" id="galleryAdjustBtn">Adjust</button>
        <button class="btn btn-outline" id="galleryNextBtn" style="background:#333; color:white">Next</button>
      </div>
    </div>
  </div>
</div>

<!-- Public payment modal (what users see) -->
<div id="paymentDisplayModal" class="modal-overlay" style="z-index:2000">
  <div class="modal-content" style="max-width:600px; overflow-y:auto; max-height:80vh">
    <h3>☕ Support the Developer</h3>
    <div id="paymentMethodsContainer" style="margin:16px 0"></div>
    <button class="btn btn-outline" id="closePaymentDisplayModal">Close</button>
  </div>
</div>

<!-- Secret editor modal (for you to add/change payment info) -->
<div id="paymentEditorModal" class="modal-overlay" style="z-index:2100">
  <div class="modal-content" style="max-width:700px; width:90%; overflow-y:auto; max-height:85vh">
    <h3>🔧 Payment Editor (Secret)</h3>
    <div id="editorPaymentList"></div>
    <button class="btn btn-primary" id="addNewMethodBtn" style="margin:12px 0">+ Add New Payment Method</button>
    <hr style="margin:12px 0; border-color:#4b5563">
    <button class="btn btn-outline" id="viewPublicModalBtn">👁️ View Public Modal</button>
    <button class="btn btn-outline" id="closeEditorModalBtn" style="margin-left:12px">Close</button>
    <p style="font-size:0.7rem; margin-top:12px; color:#9ca3af">All data saved automatically to your browser (localStorage). No database needed.</p>
  </div>
</div>

<script src="script.js"></script>
<script src="payment.js"></script>
</body>
</html>
