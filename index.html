<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweff — Simple Photo Framing Studio</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

  <div class="app-container">
    <div class="sidebar">
      <h2>⚡ SWEFF</h2>
      <p class="subtitle">Batch Photo Framer</p>
      
      <div class="input-group">
        <label>1. Upload Frame (PNG)</label>
        <input type="file" id="frameInput" accept="image/png">
      </div>
      
      <div class="input-group">
        <label>2. Upload Photos</label>
        <input type="file" id="photosInput" multiple accept="image/*">
      </div>

      <button class="btn btn-primary" onclick="generatePreview()">Generate Preview</button>
      
      <div class="export-section" id="exportSection" style="display: none;">
        <div class="input-group">
          <label>ZIP File Name</label>
          <input type="text" id="zipName" value="Framed_Photos">
        </div>
        <button class="btn btn-success" onclick="downloadZip()">Download ZIP</button>
      </div>
    </div>

    <div class="main-content">
      <div id="previewContent" class="preview-grid">
        <div class="empty-state">
          <div class="icon">🖼️</div>
          <h3>Ready to Frame?</h3>
          <p>Upload a frame and some photos to generate your preview grid.</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
