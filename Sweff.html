<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sweff — Pro Photo Framing Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; width: 100%; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 40%, #0f1628 100%); color: #e0e0e0; display: flex; height: 100%; width: 100%; overflow: hidden; }

    .main-wrapper { display: flex; flex-direction: column; width: 100%; height: 100%; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 30px; border-bottom: 1px solid rgba(14, 165, 233, 0.1); background: rgba(15, 20, 35, 0.4); backdrop-filter: blur(5px); gap: 40px; }
    .top-bar h1 { font-size: 28px; margin: 0; background: linear-gradient(135deg, #00d4ff, #0ea5e9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; letter-spacing: 2px; flex-shrink: 0; }
    .enhance-actions { display: flex; gap: 16px; align-items: center; flex: 1; margin-left: auto; }
    
    .theme-picker { display: flex; gap: 8px; align-items: center; }
    .theme-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.3s ease; }
    .theme-btn:hover { transform: scale(1.1); }
    .theme-btn.active { border-color: white; box-shadow: 0 0 12px currentColor; }
    .theme-cyan { background: linear-gradient(135deg, #0ea5e9, #06b6d4); }
    .theme-purple-btn { background: linear-gradient(135deg, #a855f7, #9333ea); }
    .theme-pink-btn { background: linear-gradient(135deg, #ec4899, #be185d); }
    .theme-green-btn { background: linear-gradient(135deg, #10b981, #059669); }
    .theme-orange-btn { background: linear-gradient(135deg, #f59e0b, #d97706); }

    .content-wrapper { display: flex; flex: 1; width: 100%; overflow: hidden; }
    .sidebar { width: 280px; background: linear-gradient(180deg, rgba(20, 25, 45, 0.95) 0%, rgba(15, 20, 35, 0.95) 100%); border-right: 1px solid rgba(14, 165, 233, 0.15); padding: 20px; overflow-y: auto; backdrop-filter: blur(10px); box-shadow: inset -20px 0 40px rgba(0, 0, 0, 0.3); }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(14, 165, 233, 0.3); border-radius: 3px; }
    .sidebar::-webkit-scrollbar-thumb:hover { background: rgba(14, 165, 233, 0.5); }

    .main-content { flex: 1; display: flex; flex-direction: column; background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%); overflow: hidden; }
    .preview-container { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; }
    .preview-container::-webkit-scrollbar { width: 8px; }
    .preview-container::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
    .preview-container::-webkit-scrollbar-thumb { background: rgba(14, 165, 233, 0.3); border-radius: 4px; }
    .preview-container::-webkit-scrollbar-thumb:hover { background: rgba(14, 165, 233, 0.5); }

    .section { margin-bottom: 20px; animation: fadeInUp 0.6s ease-out; }
    .sidebar-toggle-btn { display: none; position: fixed; bottom: 20px; left: 20px; width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #0ea5e9, #0284c7); border: none; color: white; font-size: 24px; cursor: pointer; z-index: 100; box-shadow: 0 0 20px rgba(14, 165, 233, 0.3); }
    @media (max-width: 900px) { .sidebar-toggle-btn { display: flex; align-items: center; justify-content: center; } .sidebar { position: fixed; left: -280px; height: 100%; z-index: 99; transition: left 0.3s ease; } .sidebar.show { left: 0; } }
    .section h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #0ea5e9; margin: 16px 0 10px 0; padding-bottom: 6px; border-bottom: 1px solid rgba(14, 165, 233, 0.2); }
    .section:first-child h3 { margin-top: 0; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .card { background: rgba(255, 255, 255, 0.04); border-radius: 12px; border: 1px solid rgba(14, 165, 233, 0.15); padding: 14px; margin-bottom: 10px; backdrop-filter: blur(8px); transition: all 0.3s ease; }
    .card:hover { border-color: rgba(14, 165, 233, 0.4); background: rgba(14, 165, 233, 0.05); box-shadow: 0 8px 24px rgba(14, 165, 233, 0.1); }
    .card h2 { margin: 0 0 10px 0; font-size: 12px; color: #e0e0e0; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn { border: none; border-radius: 10px; padding: 10px 16px; font-weight: 600; color: white; cursor: pointer; transition: all 0.3s ease; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; position: relative; overflow: hidden; width: 100%; margin-bottom: 6px; }
    .btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.2); transition: left 0.3s ease; z-index: -1; }
    .btn:hover::before { left: 100%; }
    .btn-blue { background: linear-gradient(135deg, #0ea5e9, #0284c7); box-shadow: 0 0 15px rgba(14, 165, 233, 0.2); }
    .btn-blue:hover { box-shadow: 0 0 25px rgba(14, 165, 233, 0.4); transform: translateY(-2px); }
    .btn-amber { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
    .btn-amber:hover { box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); transform: translateY(-2px); }
    .btn-green { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
    .btn-green:hover { box-shadow: 0 0 25px rgba(16, 185, 129, 0.4); transform: translateY(-2px); }
    .btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }
    .btn-red:hover { box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); transform: translateY(-2px); }
    .btn-gray { background: linear-gradient(135deg, #64748b, #475569); box-shadow: 0 0 15px rgba(100, 116, 139, 0.2); }
    .btn-gray:hover { box-shadow: 0 0 25px rgba(100, 116, 139, 0.4); transform: translateY(-2px); }

    .input-group { margin: 8px 0; }
    .input-group label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #a0a0a0; }
    input[type="file"], input[type="text"], select { width: 100%; padding: 8px 10px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; font-size: 12px; background: rgba(255, 255, 255, 0.05); color: #e0e0e0; transition: all 0.3s ease; }
    input[type="file"]:focus, input[type="text"]:focus, select:focus { outline: none; border-color: rgba(14, 165, 233, 0.5); background: rgba(255, 255, 255, 0.08); box-shadow: 0 0 15px rgba(14, 165, 233, 0.2); }
    input[type="file"]::file-selector-button { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-right: 6px; font-size: 10px; }

    .grid-thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; width: 100%; }
    .empty-state { text-align: center; padding: 60px 30px; color: #666; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .empty-state-icon { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }
    .empty-state h3 { font-size: 18px; color: #a0a0a0; margin: 0 0 10px 0; }
    .empty-state p { font-size: 13px; color: #666; margin: 0; }

    .progress-overlay { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 15, 30, 0.95); border: 1px solid rgba(14, 165, 233, 0.3); border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(14, 165, 233, 0.1); z-index: 999; min-width: 340px; backdrop-filter: blur(10px); }
    .progress-overlay.show { display: block; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translate(-50%, -40%); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
    .progress-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 20px; text-align: center; letter-spacing: 0.5px; }
    .progress-bar-container { height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 4px; overflow: hidden; margin-bottom: 16px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #0ea5e9, #06b6d4); border-radius: 4px; width: 0%; transition: width 0.3s ease-out; position: relative; }
    .progress-bar-fill::after { content: ''; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation: shimmer 2s infinite; }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .progress-text { font-size: 13px; color: #a0a0a0; text-align: center; font-weight: 600; }

    .toggle-group { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
    .toggle { width: 48px; height: 26px; background: rgba(255, 255, 255, 0.1); border-radius: 13px; cursor: pointer; position: relative; border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; flex-shrink: 0; }
    .toggle.active { background: linear-gradient(135deg, #0ea5e9, #06b6d4); border-color: rgba(14, 165, 233, 0.5); box-shadow: 0 0 15px rgba(14, 165, 233, 0.3); }
    .toggle::after { content: ''; position: absolute; width: 20px; height: 20px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }
    .toggle.active::after { left: 24px; }
    .exposure-panel { background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 10px; margin: 10px 0; display: none; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
    .exposure-panel.show { display: block; animation: fadeInUp 0.3s ease-out; }

    .thumb { position: relative; background: rgba(255, 255, 255, 0.05); border-radius: 12px; overflow: hidden; cursor: pointer; border: 2px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); display: flex; align-items: center; justify-content: center; }
    .thumb:hover { border-color: rgba(14, 165, 233, 0.5); box-shadow: 0 12px 24px rgba(14, 165, 233, 0.2); transform: translateY(-4px); }
    .thumb canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
    .thumb-btn { position: absolute; bottom: 6px; right: 6px; padding: 4px 10px; font-size: 10px; width: auto; z-index: 2; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .modal-overlay.show { display: flex; animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal { background: linear-gradient(135deg, rgba(30, 30, 46, 0.98), rgba(26, 26, 46, 0.98)); color: white; border-radius: 16px; padding: 24px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); position: relative; display: flex; flex-direction: column; }
    .modal h3 { margin-top: 0; font-size: 20px; background: linear-gradient(135deg, #00d4ff, #0ea5e9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
    .modal-close { position: absolute; top: 12px; right: 12px; background: rgba(255, 255, 255, 0.1); border: none; color: white; font-size: 20px; cursor: pointer; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; z-index: 10; }
    .modal-close:hover { background: rgba(255, 255, 255, 0.2); }

    .gallery-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.95); z-index: 1001; backdrop-filter: blur(5px); }
    .gallery-overlay.show { display: flex; animation: fadeIn 0.3s ease-out; }
    .gallery-container { display: flex; width: 100%; height: 100%; }
    .gallery-thumbs { width: 100px; background: rgba(0, 0, 0, 0.5); overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-right: 1px solid rgba(255, 255, 255, 0.1); }
    .gallery-thumb { width: 80px; height: 80px; border-radius: 8px; cursor: pointer; border: 2px solid rgba(255, 255, 255, 0.2); overflow: hidden; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; background: #111; }
    .gallery-thumb:hover { border-color: rgba(14, 165, 233, 0.5); transform: scale(1.05); }
    .gallery-thumb.active { border-color: #0ea5e9; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }
    .gallery-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .gallery-main img { max-width: 90%; max-height: 80%; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); object-fit: contain; }
    .gallery-nav { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
    .gallery-nav button { padding: 10px 18px; background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; font-size: 12px; }
    .gallery-nav button:hover { box-shadow: 0 0 20px rgba(14, 165, 233, 0.5); transform: translateY(-2px); }
    .gallery-arrow { position: absolute; top: 50%; font-size: 48px; color: rgba(255, 255, 255, 0.7); cursor: pointer; user-select: none; transition: all 0.3s ease; }
    .gallery-arrow:hover { color: #0ea5e9; text-shadow: 0 0 20px rgba(14, 165, 233, 0.5); }
    .gallery-arrow.left { left: 20px; transform: translateY(-50%); }
    .gallery-arrow.right { right: 20px; transform: translateY(-50%); }

    .slider { width: 100%; margin: 6px 0; accent-color: #0ea5e9; height: 4px; }
    .label-row { display: flex; justify-content: space-between; font-size: 10px; color: #888; margin-top: 2px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Adjust modal specific */
    .adjust-layout { display: flex; gap: 16px; height: calc(90vh - 120px); min-height: 500px; }
    .adjust-preview-area { flex: 1; background: #111; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; min-width: 0; }
    .adjust-preview-area canvas { cursor: grab; max-width: 100%; max-height: 100%; object-fit: contain; }
    .adjust-preview-area canvas:active { cursor: grabbing; }
    .canvas-hint { position: absolute; bottom: 8px; left: 8px; font-size: 9px; color: #666; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; pointer-events: none; }
    .adjust-controls { width: 280px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); padding: 14px; overflow-y: auto; flex-shrink: 0; }
    .adjust-controls h4 { margin: 0 0 12px 0; font-size: 11px; color: #0ea5e9; text-transform: uppercase; font-weight: 700; }
    .control-section { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .control-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body>
<div class="main-wrapper">
  <div class="top-bar">
    <h1>⚡ SWEFF</h1>
    <div class="enhance-actions" id="enhanceActions" style="display: none;">
      <div class="theme-picker">
        <button class="theme-btn theme-cyan active" onclick="switchTheme('default')" title="Cyan"></button>
        <button class="theme-btn theme-purple-btn" onclick="switchTheme('purple')" title="Purple"></button>
        <button class="theme-btn theme-pink-btn" onclick="switchTheme('pink')" title="Pink"></button>
        <button class="theme-btn theme-green-btn" onclick="switchTheme('green')" title="Green"></button>
        <button class="theme-btn theme-orange-btn" onclick="switchTheme('orange')" title="Orange"></button>
      </div>
      <div style="width: 1px; height: 30px; background: rgba(255,255,255,0.1);"></div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: #a0a0a0;">Export Settings</label>
        <div class="toggle" id="enhanceToggle" onclick="toggleEnhance()"></div>
      </div>
      <div id="enhancePanel" style="display: none; background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);">
        <div class="input-group" style="margin: 0;"><label>Resolution</label> <select id="targetResolution" style="margin-top: 4px;"> <option value="1080">1080p</option> <option value="1440">1440p</option> <option value="2k">2K</option> </select></div>
        <div class="input-group" style="margin: 8px 0 0 0;"><label>Quality: <span id="qualityLabel">90</span>%</label> <input type="range" class="slider" id="qualitySlider" min="80" max="100" value="90" onchange="updateQualityLabel()" style="margin-top: 4px;"></div>
      </div>
      <button class="btn btn-green" onclick="downloadZip()" style="padding: 10px 24px; width: auto;">⬇️ Download ZIP</button>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="sidebar">
      <div class="section">
        <h3>📤 Upload &amp; Frames</h3>
        <div class="card">
          <div class="input-group"><label>Portrait Frame (PNG)</label> <input type="file" id="portraitFrame" accept="image/png"></div>
          <div class="input-group"><label>Landscape Frame (PNG)</label> <input type="file" id="landscapeFrame" accept="image/png"></div>
          <div class="input-group"><label>Photos (multiple)</label> <input type="file" id="photosInput" multiple accept="image/*"></div>
        </div>
      </div>
      <div class="section">
        <h3>💾 ZIP Export</h3>
        <div class="card">
          <div class="input-group"><label>ZIP File Name</label> <input type="text" id="zipName" placeholder="Framed_Photos" value="Framed_Photos"></div>
        </div>
      </div>
      <div class="section">
        <h3>✨ Auto Exposure</h3>
        <div class="card">
          <div class="toggle-group">
            <label style="margin: 0; font-size: 11px;">Enable</label>
            <div class="toggle" id="autoExposureToggle" onclick="toggleAutoExposure()"></div>
          </div>
          <div class="exposure-panel" id="exposurePanel">
            <div class="input-group"><label>Mode</label> <select id="exposureMode"> <option value="auto">Auto Detect</option> <option value="always">Always Apply</option> </select></div>
            <div class="input-group">
              <label>Strength: <span id="strengthLabel">Medium</span></label>
              <input type="range" class="slider" id="strengthSlider" min="1" max="5" value="3" onchange="updateStrengthLabel()">
              <div class="label-row"><span>Subtle</span><span>Strong</span><span>Aggressive</span></div>
            </div>
          </div>
        </div>
      </div>
      <div class="section">
        <h3>🔧 Processing</h3>
        <div class="card">
          <button class="btn btn-amber" onclick="generatePreview()">Generate Preview</button>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="preview-container">
        <div id="previewContent">
          <div class="empty-state">
            <div class="empty-state-icon">🖼️</div>
            <h3>Ready to Frame?</h3>
            <p>Upload your frames and photos to get started</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Adjust Modal - Now shows the full framed image -->
<div class="modal-overlay" id="adjustModal">
  <div class="modal" style="width: 95vw; max-width: 1300px; height: 92vh; max-height: 850px;">
    <button class="modal-close" onclick="closeAdjustModal()">✕</button>
    <h3 style="margin-bottom: 16px;">Advanced Photo Editor</h3>
    <div class="adjust-layout">
      <div class="adjust-preview-area" id="adjustPreviewArea">
        <canvas id="adjustCanvas"></canvas>
        <div class="canvas-hint">🖱️ Scroll: Zoom &nbsp;|&nbsp; Drag: Pan</div>
      </div>
      <div class="adjust-controls">
        <h4>Transform</h4>
        <div class="control-section">
          <div class="input-group">
            <label>Zoom: <span id="zoomLabel">100</span>%</label>
            <input type="range" class="slider" id="zoomSlider" min="50" max="300" value="100" onchange="updateZoomFromSlider()">
          </div>
          <button class="btn btn-blue" onclick="resetZoomPan()" style="font-size: 10px; padding: 6px 10px; margin-top: 4px;">Reset Zoom/Pan</button>
        </div>
        
        <h4>Color & Light</h4>
        <div class="control-section">
          <div class="input-group">
            <label>Brightness: <span id="brightnessLabel">100</span></label>
            <input type="range" class="slider" id="brightnessSlider" min="50" max="150" value="100" onchange="updateAdjustPreview()">
          </div>
          <div class="input-group">
            <label>Contrast: <span id="contrastLabel">100</span></label>
            <input type="range" class="slider" id="contrastSlider" min="50" max="200" value="100" onchange="updateAdjustPreview()">
          </div>
          <div class="input-group">
            <label>Saturation: <span id="saturationLabel">100</span></label>
            <input type="range" class="slider" id="saturationSlider" min="0" max="200" value="100" onchange="updateAdjustPreview()">
          </div>
          <div class="input-group">
            <label>Hue: <span id="hueLabel">0</span>°</label>
            <input type="range" class="slider" id="hueSlider" min="-180" max="180" value="0" onchange="updateAdjustPreview()">
          </div>
          <div class="input-group">
            <label>Temperature: <span id="temperatureLabel">0</span></label>
            <input type="range" class="slider" id="temperatureSlider" min="-100" max="100" value="0" onchange="updateAdjustPreview()">
          </div>
        </div>
        
        <h4>Effects</h4>
        <div class="control-section">
          <div class="input-group">
            <label>Sharpness: <span id="sharpnessLabel">0</span></label>
            <input type="range" class="slider" id="sharpnessSlider" min="0" max="100" value="0" onchange="updateAdjustPreview()">
          </div>
          <div class="input-group">
            <label>Vignette: <span id="vignetteLabel">0</span></label>
            <input type="range" class="slider" id="vignetteSlider" min="0" max="100" value="0" onchange="updateAdjustPreview()">
          </div>
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px;">
          <button class="btn btn-gray" onclick="resetAllAdjustments()" style="font-size: 10px; padding: 8px;">Reset All</button>
          <button class="btn btn-green" onclick="saveAdjustment()" style="font-size: 10px; padding: 8px;">✓ Save Changes</button>
          <button class="btn btn-red" onclick="closeAdjustModal()" style="font-size: 10px; padding: 8px;">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="gallery-overlay" id="galleryOverlay">
  <div class="gallery-container">
    <div class="gallery-thumbs" id="galleryThumbs"></div>
    <div class="gallery-main">
      <img id="galleryMainImg" src="">
      <div class="gallery-nav">
        <button onclick="galleryPrev()">← Prev</button>
        <button onclick="galleryNext()">Next →</button>
        <button class="btn btn-blue" onclick="openAdjustFromGallery()" style="padding: 8px 12px; width: auto;">Adjust</button>
        <button class="btn btn-red" onclick="closeGallery()" style="padding: 8px 12px; width: auto;">Close</button>
      </div>
      <div class="gallery-arrow left" onclick="galleryPrev()">‹</div>
      <div class="gallery-arrow right" onclick="galleryNext()">›</div>
    </div>
  </div>
</div>

<div class="progress-overlay" id="progressOverlay">
  <div class="progress-title" id="progressTitle">Processing...</div>
  <div class="progress-bar-container"><div class="progress-bar-fill" id="progressBarFill"></div></div>
  <div class="progress-text" id="progressText">0%</div>
</div>

<button class="sidebar-toggle-btn" id="sidebarToggle" onclick="toggleSidebar()">☰</button>

<script>
  const MAX_DECODE_PX = 1200;
  const THUMB_MAX_WIDTH = 200;
  let portraitFrameFile = null;
  let landscapeFrameFile = null;
  let photosFiles = [];
  let batch = [];
  let currentAdjustIndex = -1;
  let currentGalleryIndex = 0;
  let editorState = { portrait: { x: 0, y: 0, scale: 1 }, landscape: { x: 0, y: 0, scale: 1 } };
  let adjustState = { zoom: 1, panX: 0, panY: 0, brightness: 100, contrast: 100, saturation: 100, hue: 0, sharpness: 0, temperature: 0, vignette: 0 };

  function switchTheme(theme) {
    document.body.className = theme === 'default' ? '' : `theme-${theme}`;
    localStorage.setItem('sweff-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.style.borderColor = 'transparent');
    const map = { default: '.theme-cyan', purple: '.theme-purple-btn', pink: '.theme-pink-btn', green: '.theme-green-btn', orange: '.theme-orange-btn' };
    const sel = map[theme];
    if (sel) document.querySelector(sel).style.borderColor = 'white';
  }

  function toggleSidebar() { document.querySelector('.sidebar').classList.toggle('show'); }
  function closeSidebar() { if (window.innerWidth <= 900) document.querySelector('.sidebar').classList.remove('show'); }

  function showProgress(title) {
    document.getElementById('progressTitle').textContent = title;
    document.getElementById('progressBarFill').style.width = '0%';
    document.getElementById('progressText').textContent = '0%';
    document.getElementById('progressOverlay').classList.add('show');
  }
  function updateProgress(current, total) {
    const p = Math.round((current / total) * 100);
    document.getElementById('progressBarFill').style.width = p + '%';
    document.getElementById('progressText').textContent = p + '%';
  }
  function hideProgress() { document.getElementById('progressOverlay').classList.remove('show'); }

  function toggleAutoExposure() {
    document.getElementById('autoExposureToggle').classList.toggle('active');
    document.getElementById('exposurePanel').classList.toggle('show');
  }
  function toggleEnhance() {
    document.getElementById('enhanceToggle').classList.toggle('active');
    document.getElementById('enhancePanel').style.display = 
      document.getElementById('enhanceToggle').classList.contains('active') ? 'block' : 'none';
  }
  function updateStrengthLabel() {
    const v = document.getElementById('strengthSlider').value;
    document.getElementById('strengthLabel').textContent = ['', 'Subtle', 'Light', 'Medium', 'Strong', 'Aggressive'][v];
  }
  function updateQualityLabel() { document.getElementById('qualityLabel').textContent = document.getElementById('qualitySlider').value; }

  function showError(msg) {
    let overlay = document.getElementById('errorOverlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'errorOverlay';
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `<div class="modal" style="max-width:400px;text-align:center;">
        <button class="modal-close" onclick="this.closest('.modal-overlay').classList.remove('show')">✕</button>
        <div style="font-size:40px;margin-bottom:16px;color:#ef4444;">⚠️</div>
        <h3 style="color:#fca5a5;margin:0 0 12px;font-size:18px;">Error</h3>
        <p id="errorMessage" style="color:#e0e0e0;margin:0 0 20px;font-size:14px;line-height:1.5;"></p>
        <button class="btn btn-red" onclick="this.closest('.modal-overlay').classList.remove('show')" style="width:100%;padding:12px;">Got It</button>
      </div>`;
      document.body.appendChild(overlay);
    }
    document.getElementById('errorMessage').textContent = msg;
    overlay.classList.add('show');
  }

  async function validateFrameOrientation(file, expected) {
    const img = await loadImage(file);
    const actual = img.width > img.height ? 'landscape' : 'portrait';
    if (actual !== expected) { showError(`This frame is ${actual}, expected ${expected}.`); return false; }
    return true;
  }

  document.getElementById('portraitFrame').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (f) { if (await validateFrameOrientation(f, 'portrait')) portraitFrameFile = f; else { portraitFrameFile = null; e.target.value = ''; } }
  });
  document.getElementById('landscapeFrame').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (f) { if (await validateFrameOrientation(f, 'landscape')) landscapeFrameFile = f; else { landscapeFrameFile = null; e.target.value = ''; } }
  });
  document.getElementById('photosInput').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    const validFiles = [], invalid = [];
    showProgress('Validating photos...');
    for (let i = 0; i < files.length; i++) {
      if (i % 5 === 0) { await new Promise(r => setTimeout(r, 50)); updateProgress(i, files.length); }
      try {
        const img = await loadImage(files[i]);
        const c = document.createElement('canvas'); c.width = 100; c.height = 100;
        const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, 100, 100);
        const data = ctx.getImageData(0, 0, 100, 100).data;
        let variance = 0;
        for (let j = 0; j < data.length; j += 4) variance += Math.abs(data[j]-data[j+1]) + Math.abs(data[j+1]-data[j+2]) + Math.abs(data[j+2]-data[j]);
        variance > 1000 ? validFiles.push(files[i]) : invalid.push(i+1);
      } catch { invalid.push(i+1); }
    }
    hideProgress();
    if (invalid.length) showError(`${invalid.length} image(s) excluded. ${validFiles.length} valid loaded.`);
    photosFiles = validFiles;
  });

  async function loadImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => { const img = new Image(); img.onload = () => resolve(img); img.src = e.target.result; };
      reader.readAsDataURL(file);
    });
  }

  async function downscaleImage(img) {
    if (img.width <= MAX_DECODE_PX && img.height <= MAX_DECODE_PX) return img;
    const s = Math.min(MAX_DECODE_PX/img.width, MAX_DECODE_PX/img.height);
    const c = document.createElement('canvas'); c.width = img.width*s; c.height = img.height*s;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c;
  }

  function detectOrientation(img) { return img.width > img.height ? 'landscape' : 'portrait'; }

  function autoEnhanceImage(imageData, strength) {
    const data = imageData.data;
    let rSum=0,gSum=0,bSum=0,count=data.length/4;
    for (let i=0;i<data.length;i+=4) { rSum+=data[i]; gSum+=data[i+1]; bSum+=data[i+2]; }
    const avgR=rSum/count,avgG=gSum/count,avgB=bSum/count;
    const avgLum=0.299*avgR+0.587*avgG+0.114*avgB;
    const bf=1+((128-avgLum)/256)*(strength/3), cf=1+0.2*(strength/3), mp=128;
    for (let i=0;i<data.length;i+=4) {
      let r=data[i],g=data[i+1],b=data[i+2];
      r=mp+(r-mp)*cf; g=mp+(g-mp)*cf; b=mp+(b-mp)*cf;
      r=Math.min(255,r*bf); g=Math.min(255,g*bf); b=Math.min(255,b*bf);
      data[i]=Math.max(0,Math.min(255,r)); data[i+1]=Math.max(0,Math.min(255,g)); data[i+2]=Math.max(0,Math.min(255,b));
    }
    return imageData;
  }

  function applySharpness(imageData, amount) {
    if (amount===0) return imageData;
    const data=imageData.data, w=imageData.width, h=imageData.height;
    const copy=new Uint8ClampedArray(data), s=amount/100;
    const k=[0,-1,0, -1,4+(1-s)*4,-1, 0,-1,0];
    for (let y=1;y<h-1;y++) for (let x=1;x<w-1;x++) {
      let r=0,g=0,b=0;
      for (let ky=-1;ky<=1;ky++) for (let kx=-1;kx<=1;kx++) {
        const idx=((y+ky)*w+(x+kx))*4, kv=k[(ky+1)*3+(kx+1)];
        r+=copy[idx]*kv; g+=copy[idx+1]*kv; b+=copy[idx+2]*kv;
      }
      const idx=(y*w+x)*4;
      data[idx]=Math.max(0,Math.min(255,r)); data[idx+1]=Math.max(0,Math.min(255,g)); data[idx+2]=Math.max(0,Math.min(255,b));
    }
    return imageData;
  }

  function applyVignette(imageData, amount) {
    if (amount===0) return imageData;
    const data=imageData.data, w=imageData.width, h=imageData.height;
    const cx=w/2, cy=h/2, maxD=Math.sqrt(cx*cx+cy*cy);
    for (let y=0;y<h;y++) for (let x=0;x<w;x++) {
      const d=Math.sqrt((x-cx)*(x-cx)+(y-cy)*(y-cy));
      const f=Math.max(0,1-(d/maxD)*(amount/100)), idx=(y*w+x)*4;
      data[idx]*=f; data[idx+1]*=f; data[idx+2]*=f;
    }
    return imageData;
  }

  function applyTemperature(imageData, amount) {
    if (amount===0) return imageData;
    const data=imageData.data, w=amount/100;
    for (let i=0;i<data.length;i+=4) {
      if (w>0) { data[i]=Math.min(255,data[i]*(1+w*0.3)); data[i+1]=Math.min(255,data[i+1]*(1+w*0.15)); data[i+2]=Math.max(0,data[i+2]*(1-w*0.3)); }
      else { const c=-w; data[i]=Math.max(0,data[i]*(1-c*0.3)); data[i+1]=Math.max(0,data[i+1]*(1-c*0.15)); data[i+2]=Math.min(255,data[i+2]*(1+c*0.3)); }
    }
    return imageData;
  }

  async function generatePreview() {
    if (batch.length > 0 && !confirm('Preview already generated. Overwrite?')) return;
    batch = [];
    showProgress('Framing Photos...');
    document.getElementById('previewContent').innerHTML = '<div class="grid-thumbs" id="previewGrid"></div>';
    const autoExp = document.getElementById('autoExposureToggle').classList.contains('active');
    const strength = parseInt(document.getElementById('strengthSlider').value);
    
    for (let i = 0; i < photosFiles.length; i++) {
      await new Promise(r => setTimeout(r, 50));
      updateProgress(i+1, photosFiles.length);
      const img = await loadImage(photosFiles[i]);
      const scaled = await downscaleImage(img);
      const orientation = detectOrientation(scaled);
      const frameFile = orientation === 'portrait' ? portraitFrameFile : landscapeFrameFile;
      const frame = await loadImage(frameFile);
      batch.push({
        photo: scaled, frame, orientation,
        cropState: { ...(orientation==='portrait'?editorState.portrait:editorState.landscape) },
        brightness:100, contrast:100, saturation:100, hue:0, sharpness:0, temperature:0, vignette:0,
        zoom:1, panX:0, panY:0, index:i, autoEnhanced:autoExp, enhanceStrength:strength
      });
      await renderSinglePreviewThumbnail(i);
    }
    hideProgress();
    closeSidebar();
    document.getElementById('enhanceActions').style.display = 'flex';
  }

  async function renderSinglePreviewThumbnail(idx) {
    const grid = document.getElementById('previewGrid');
    const item = batch[idx];
    let thumb = grid.querySelector(`[data-index="${idx}"]`);
    if (!thumb) {
      thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.setAttribute('data-index', idx);
      thumb.innerHTML = '<canvas></canvas>';
      grid.appendChild(thumb);
    }
    const fa = item.frame.width/item.frame.height;
    let tw, th;
    if (fa>=1) { tw=THUMB_MAX_WIDTH; th=THUMB_MAX_WIDTH/fa; }
    else { th=THUMB_MAX_WIDTH; tw=THUMB_MAX_WIDTH*fa; }
    thumb.style.width=tw+'px'; thumb.style.height=th+'px';
    const canvas=thumb.querySelector('canvas'), dpr=window.devicePixelRatio||1;
    canvas.width=tw*dpr; canvas.height=th*dpr;
    canvas.style.width=tw+'px'; canvas.style.height=th+'px';
    compositeImage(item, canvas);
    if (!thumb.querySelector('.thumb-btn')) {
      const btn=document.createElement('button');
      btn.className='btn btn-blue thumb-btn'; btn.textContent='Adjust';
      btn.onclick=(e)=>{e.stopPropagation(); openAdjustModal(idx);};
      thumb.appendChild(btn);
    }
    thumb.onclick=()=>openGallery(idx);
  }

  function renderPreviewGrid() {
    batch.forEach((item, idx) => {
      const thumb = document.getElementById('previewGrid')?.querySelector(`[data-index="${idx}"]`);
      if (thumb) compositeImage(item, thumb.querySelector('canvas'));
    });
  }

  function compositeImage(item, targetCanvas, useAdjustState=false) {
    const { photo, frame, cropState, autoEnhanced, enhanceStrength } = item;
    const ctx = targetCanvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,targetCanvas.width,targetCanvas.height);
    
    const displayW = targetCanvas.width/dpr, displayH = targetCanvas.height/dpr;
    ctx.fillStyle='#000'; ctx.fillRect(0,0,targetCanvas.width,targetCanvas.height);
    
    const fa = frame.width/frame.height;
    let fdw, fdh;
    if (fa>=1) { fdw=displayW; fdh=displayW/fa; }
    else { fdh=displayH; fdw=displayH*fa; }
    const fx=(displayW-fdw)/2, fy=(displayH-fdh)/2;
    
    let source=photo;
    if (autoEnhanced) {
      const t=document.createElement('canvas'); t.width=photo.width; t.height=photo.height;
      const tctx=t.getContext('2d'); tctx.drawImage(photo,0,0);
      tctx.putImageData(autoEnhanceImage(tctx.getImageData(0,0,photo.width,photo.height),enhanceStrength),0,0);
      source=t;
    }
    
    let b=item.brightness||100, c=item.contrast||100, s=item.saturation||100, h=item.hue||0;
    let sh=item.sharpness||0, tmp=item.temperature||0, v=item.vignette||0;
    let z=item.zoom||1, px=item.panX||0, py=item.panY||0;
    if (useAdjustState) {
      b=adjustState.brightness; c=adjustState.contrast; s=adjustState.saturation; h=adjustState.hue;
      sh=adjustState.sharpness; tmp=adjustState.temperature; v=adjustState.vignette;
      z=adjustState.zoom; px=adjustState.panX; py=adjustState.panY;
    }
    
    const ac=document.createElement('canvas'); ac.width=source.width; ac.height=source.height;
    const actx=ac.getContext('2d');
    actx.filter=`brightness(${b/100}) contrast(${c/100}) saturate(${s/100}) hue-rotate(${h}deg)`;
    actx.drawImage(source,0,0);
    actx.filter='none';
    if (sh>0) { const id=actx.getImageData(0,0,ac.width,ac.height); applySharpness(id,sh); actx.putImageData(id,0,0); }
    if (tmp!==0) { const id=actx.getImageData(0,0,ac.width,ac.height); applyTemperature(id,tmp); actx.putImageData(id,0,0); }
    if (v>0) { const id=actx.getImageData(0,0,ac.width,ac.height); applyVignette(id,v); actx.putImageData(id,0,0); }
    source=ac;
    
    const pa = source.width/source.height;
    let sw, sh2, sx, sy;
    if (pa>fa) { sh2=source.height/z; sw=sh2*fa; }
    else { sw=source.width/z; sh2=sw/fa; }
    sx=(source.width-sw)/2-px+(cropState.x||0);
    sy=(source.height-sh2)/2-py+(cropState.y||0);
    sx=Math.max(0,Math.min(sx,source.width-sw));
    sy=Math.max(0,Math.min(sy,source.height-sh2));
    sw=Math.min(sw,source.width-sx); sh2=Math.min(sh2,source.height-sy);
    
    ctx.save(); ctx.scale(dpr,dpr);
    ctx.drawImage(source,sx,sy,sw,sh2,fx,fy,fdw,fdh);
    ctx.drawImage(frame,fx,fy,fdw,fdh);
    ctx.restore();
  }

  // ADJUST MODAL - Now fills the preview area with the framed image
  function openAdjustModal(idx) {
    currentAdjustIndex = idx;
    const item = batch[idx];
    adjustState = {
      zoom: item.zoom||1, panX: item.panX||0, panY: item.panY||0,
      brightness: item.brightness||100, contrast: item.contrast||100, saturation: item.saturation||100,
      hue: item.hue||0, sharpness: item.sharpness||0, temperature: item.temperature||0, vignette: item.vignette||0
    };
    
    document.getElementById('zoomSlider').value=Math.round(adjustState.zoom*100);
    document.getElementById('brightnessSlider').value=adjustState.brightness;
    document.getElementById('contrastSlider').value=adjustState.contrast;
    document.getElementById('saturationSlider').value=adjustState.saturation;
    document.getElementById('hueSlider').value=adjustState.hue;
    document.getElementById('sharpnessSlider').value=adjustState.sharpness;
    document.getElementById('temperatureSlider').value=adjustState.temperature;
    document.getElementById('vignetteSlider').value=adjustState.vignette;
    updateAllLabels();
    
    document.getElementById('adjustModal').classList.add('show');
    
    // Wait for modal to be visible, then size canvas
    requestAnimationFrame(() => {
      requestAnimationFrame(() => sizeAdjustCanvas(item));
    });
  }

  function sizeAdjustCanvas(item) {
    const area = document.getElementById('adjustPreviewArea');
    const canvas = document.getElementById('adjustCanvas');
    const fa = item.frame.width / item.frame.height;
    const maxW = area.clientWidth - 20;
    const maxH = area.clientHeight - 20;
    
    let cw, ch;
    if (fa >= 1) { cw = maxW; ch = cw / fa; if (ch > maxH) { ch = maxH; cw = ch * fa; } }
    else { ch = maxH; cw = ch * fa; if (cw > maxW) { cw = maxW; ch = cw / fa; } }
    
    const dpr = window.devicePixelRatio || 1;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    
    setupAdjustCanvasEvents(canvas, item);
    drawAdjustCanvas();
  }

  function setupAdjustCanvasEvents(canvas, item) {
    const newCanvas = canvas.cloneNode(true);
    canvas.parentNode.replaceChild(newCanvas, canvas);
    
    let isPanning = false, startX, startY, startPanX, startPanY;
    
    newCanvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      adjustState.zoom *= e.deltaY < 0 ? 1.1 : 0.9;
      adjustState.zoom = Math.max(0.5, Math.min(3, adjustState.zoom));
      document.getElementById('zoomSlider').value = Math.round(adjustState.zoom * 100);
      document.getElementById('zoomLabel').textContent = Math.round(adjustState.zoom * 100);
      drawAdjustCanvas();
    });
    
    newCanvas.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        isPanning = true;
        const rect = newCanvas.getBoundingClientRect();
        startX = e.clientX - rect.left;
        startY = e.clientY - rect.top;
        startPanX = adjustState.panX;
        startPanY = adjustState.panY;
        newCanvas.style.cursor = 'grabbing';
      }
    });
    
    document.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      const rect = newCanvas.getBoundingClientRect();
      adjustState.panX = startPanX + (e.clientX - rect.left - startX) * 2;
      adjustState.panY = startPanY + (e.clientY - rect.top - startY) * 2;
      drawAdjustCanvas();
    });
    
    document.addEventListener('mouseup', () => { if (isPanning) { isPanning = false; newCanvas.style.cursor = 'grab'; } });
    newCanvas.addEventListener('contextmenu', e => e.preventDefault());
    
    // Touch
    newCanvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        newCanvas.dataset.pinchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      } else if (e.touches.length === 1) {
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        startPanX = adjustState.panX; startPanY = adjustState.panY;
        isPanning = true;
      }
    });
    newCanvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 2) {
        const dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        const prev = parseFloat(newCanvas.dataset.pinchDist || dist);
        adjustState.zoom *= dist / prev;
        adjustState.zoom = Math.max(0.5, Math.min(3, adjustState.zoom));
        newCanvas.dataset.pinchDist = dist;
        document.getElementById('zoomSlider').value = Math.round(adjustState.zoom*100);
        document.getElementById('zoomLabel').textContent = Math.round(adjustState.zoom*100);
        drawAdjustCanvas();
      } else if (e.touches.length === 1 && isPanning) {
        adjustState.panX = startPanX + (e.touches[0].clientX-startX)*2;
        adjustState.panY = startPanY + (e.touches[0].clientY-startY)*2;
        drawAdjustCanvas();
      }
    });
    newCanvas.addEventListener('touchend', () => { isPanning=false; newCanvas.style.cursor='grab'; });
  }

  function drawAdjustCanvas() {
    const canvas = document.getElementById('adjustCanvas');
    if (!canvas || currentAdjustIndex < 0) return;
    compositeImage(batch[currentAdjustIndex], canvas, true);
  }

  function updateZoomFromSlider() {
    adjustState.zoom = document.getElementById('zoomSlider').value / 100;
    document.getElementById('zoomLabel').textContent = Math.round(adjustState.zoom * 100);
    drawAdjustCanvas();
  }

  function updateAllLabels() {
    document.getElementById('zoomLabel').textContent = Math.round(adjustState.zoom*100);
    document.getElementById('brightnessLabel').textContent = adjustState.brightness;
    document.getElementById('contrastLabel').textContent = adjustState.contrast;
    document.getElementById('saturationLabel').textContent = adjustState.saturation;
    document.getElementById('hueLabel').textContent = adjustState.hue;
    document.getElementById('sharpnessLabel').textContent = adjustState.sharpness;
    document.getElementById('temperatureLabel').textContent = adjustState.temperature;
    document.getElementById('vignetteLabel').textContent = adjustState.vignette;
  }

  function updateAdjustPreview() {
    adjustState.brightness = parseInt(document.getElementById('brightnessSlider').value);
    adjustState.contrast = parseInt(document.getElementById('contrastSlider').value);
    adjustState.saturation = parseInt(document.getElementById('saturationSlider').value);
    adjustState.hue = parseInt(document.getElementById('hueSlider').value);
    adjustState.sharpness = parseInt(document.getElementById('sharpnessSlider').value);
    adjustState.temperature = parseInt(document.getElementById('temperatureSlider').value);
    adjustState.vignette = parseInt(document.getElementById('vignetteSlider').value);
    updateAllLabels();
    drawAdjustCanvas();
  }

  function resetAllAdjustments() {
    adjustState = { zoom:1, panX:0, panY:0, brightness:100, contrast:100, saturation:100, hue:0, sharpness:0, temperature:0, vignette:0 };
    document.getElementById('zoomSlider').value=100;
    document.getElementById('brightnessSlider').value=100;
    document.getElementById('contrastSlider').value=100;
    document.getElementById('saturationSlider').value=100;
    document.getElementById('hueSlider').value=0;
    document.getElementById('sharpnessSlider').value=0;
    document.getElementById('temperatureSlider').value=0;
    document.getElementById('vignetteSlider').value=0;
    updateAllLabels();
    drawAdjustCanvas();
  }

  function resetZoomPan() {
    adjustState.zoom=1; adjustState.panX=0; adjustState.panY=0;
    document.getElementById('zoomSlider').value=100;
    document.getElementById('zoomLabel').textContent='100';
    drawAdjustCanvas();
  }

  function closeAdjustModal() { document.getElementById('adjustModal').classList.remove('show'); }

  function saveAdjustment() {
    const item = batch[currentAdjustIndex];
    Object.assign(item, adjustState);
    renderPreviewGrid();
    if (batch.length) renderGalleryThumbs();
    closeAdjustModal();
  }

  // Gallery
  function openGallery(startIdx=0) {
    document.getElementById('galleryOverlay').classList.add('show');
    currentGalleryIndex=startIdx; renderGalleryThumbs(); showGalleryImage(currentGalleryIndex);
  }
  function closeGallery() { document.getElementById('galleryOverlay').classList.remove('show'); }
  function renderGalleryThumbs() {
    const container = document.getElementById('galleryThumbs');
    container.innerHTML='';
    batch.forEach((item,idx)=>{
      const div=document.createElement('div');
      div.className='gallery-thumb'+(idx===currentGalleryIndex?' active':'');
      const c=document.createElement('canvas'), fa=item.frame.width/item.frame.height, size=80;
      let w,h; if(fa>=1){w=size;h=size/fa;}else{h=size;w=size*fa;}
      c.width=w*2;c.height=h*2;c.style.width=w+'px';c.style.height=h+'px';
      compositeImage(item,c); div.appendChild(c);
      div.onclick=()=>showGalleryImage(idx); container.appendChild(div);
    });
  }
  function showGalleryImage(idx) {
    currentGalleryIndex=Math.max(0,Math.min(idx,batch.length-1));
    const item=batch[currentGalleryIndex], fa=item.frame.width/item.frame.height, maxW=1200,maxH=800;
    let cw,ch; if(fa>=1){cw=Math.min(maxW,maxH*fa);ch=cw/fa;}else{ch=Math.min(maxH,maxW/fa);cw=ch*fa;}
    const c=document.createElement('canvas');c.width=cw;c.height=ch;
    compositeImage(item,c); document.getElementById('galleryMainImg').src=c.toDataURL(); renderGalleryThumbs();
  }
  function galleryPrev(){showGalleryImage(currentGalleryIndex-1);}
  function galleryNext(){showGalleryImage(currentGalleryIndex+1);}
  function openAdjustFromGallery(){openAdjustModal(currentGalleryIndex);}

  document.addEventListener('keydown',(e)=>{
    if(document.getElementById('galleryOverlay').classList.contains('show')){
      if(e.key==='ArrowLeft')galleryPrev();
      if(e.key==='ArrowRight')galleryNext();
    }
  });

  let touchStart=0;
  document.getElementById('galleryOverlay').addEventListener('touchstart',(e)=>{touchStart=e.touches[0].clientX;});
  document.getElementById('galleryOverlay').addEventListener('touchend',(e)=>{
    const diff=touchStart-e.changedTouches[0].clientX;
    if(Math.abs(diff)>50)diff>0?galleryNext():galleryPrev();
  });

  async function downloadZip() {
    const zip=new JSZip();
    const enhanceEnabled=document.getElementById('enhanceToggle').classList.contains('active');
    const quality=parseInt(document.getElementById('qualitySlider').value)/100;
    showProgress('Creating ZIP...');
    for(let i=0;i<batch.length;i++){
      await new Promise(r=>setTimeout(r,50)); updateProgress(i+1,batch.length);
      const item=batch[i], fa=item.frame.width/item.frame.height;
      let th=enhanceEnabled?(document.getElementById('targetResolution').value==='1080'?1080:1440):1080;
      const tw=Math.round(th*fa), c=document.createElement('canvas');c.width=tw;c.height=th;
      compositeImage(item,c);
      const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',quality));
      zip.file(`framed_${String(i+1).padStart(3,'0')}.jpg`,blob);
    }
    hideProgress();
    const zipBlob=await zip.generateAsync({type:'blob'});
    const a=document.createElement('a');a.href=URL.createObjectURL(zipBlob);
    a.download=(document.getElementById('zipName').value||'Framed_Photos')+'.zip';a.click();
    URL.revokeObjectURL(a.href);
  }

  window.addEventListener('DOMContentLoaded',()=>{switchTheme(localStorage.getItem('sweff-theme')||'default');});
  
  // Handle window resize for adjust modal
  window.addEventListener('resize', () => {
    if (document.getElementById('adjustModal').classList.contains('show') && currentAdjustIndex >= 0) {
      sizeAdjustCanvas(batch[currentAdjustIndex]);
    }
  });
</script>
</body>
</html>
